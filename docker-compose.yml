services:
  firstbank.api:
    image: ${DOCKER_REGISTRY-}firstbankapi
    build:
      context: .
      dockerfile: FirstBank.API/Dockerfile
    ports:
      - "8083:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=FirstBankDb;User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      - Jwt__Key= ${JWT_SECRET_KEY}
      - Jwt__Issuer=FirstBank.Api
      - Jwt__Audience=FirstBank.Clients 
    depends_on:
      - db
      - seq

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_PASSWORD}
   # ports:
   #  - "1434:1433"
    volumes:
      - mssql_data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_ADMINPASSWORD=SeqAdminPass2026!
    ports:
      - "5342:5341"
      - "8082:80"

volumes:
  mssql_data: